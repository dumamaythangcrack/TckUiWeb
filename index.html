<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TckExc</title>

    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js">
    </script>

    <!-- Font Awesome (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --card: #1a1a1a;
            --card-hover: #202020;
            --border: #2a2a2a;
            --border-light: #333333;
            --text: #f0f0f0;
            --text-secondary: #9a9a9a;
            --text-muted: #666666;
            --accent: #4a9eff;
            --accent-hover: #3a8eef;
            --success: #4caf50;
            --error: #f44336;
            --warning: #ff9800;
            --info: #4a9eff;
            --sidebar-width: 240px;
            --header-height: 0px;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow: 0 4px 24px rgba(0, 0, 0, .5);
            --transition: .2s ease;
            --font: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        }
        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            color: var(--accent-hover);
        }
        button {
            font-family: var(--font);
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: var(--text);
            font-size: 13px;
            transition: var(--transition);
        }
        input,
        textarea,
        select {
            font-family: var(--font);
            outline: none;
            border: none;
            background: none;
            color: var(--text);
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .6s ease, visibility .6s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        #loading-screen .logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            object-fit: contain;
            margin-bottom: 16px;
            background: var(--card);
            padding: 8px;
        }
        #loading-screen .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -.5px;
            margin-bottom: 6px;
        }
        #loading-screen .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            min-height: 20px;
        }
        #loading-screen .progress-track {
            width: 280px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        #loading-screen .progress-bar {
            height: 100%;
            width: 0;
            background: var(--accent);
            border-radius: 2px;
            transition: width .4s ease;
        }
        #loading-screen .progress-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            min-width: 40px;
            text-align: center;
        }

        /* ===== APP LAYOUT ===== */
        #app {
            display: flex;
            height: 100vh;
            opacity: 0;
            transition: opacity .4s ease;
        }
        #app.visible {
            opacity: 1;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
        }
        #sidebar .branding {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        #sidebar .branding .logo-sm {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: contain;
            background: var(--card);
            padding: 4px;
        }
        #sidebar .branding .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.3px;
        }
        #sidebar .nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        #sidebar .nav-item i {
            width: 18px;
            font-size: 15px;
            text-align: center;
            flex-shrink: 0;
        }
        #sidebar .nav-item:hover {
            background: var(--card);
            color: var(--text);
        }
        #sidebar .nav-item.active {
            background: var(--card);
            color: var(--accent);
        }
        #sidebar .nav-bottom {
            padding: 12px 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #sidebar .nav-bottom .nav-item {
            font-size: 13px;
        }
        #sidebar .nav-bottom .nav-item i {
            font-size: 14px;
        }

        /* ===== MAIN CONTENT ===== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        #main .page-header {
            padding: 20px 28px 4px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.3px;
            flex-shrink: 0;
        }
        #main .page-content {
            flex: 1;
            padding: 16px 28px 28px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            animation: fadeIn .25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== DASHBOARD CARDS ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            transition: var(--transition);
        }
        .card:hover {
            border-color: var(--border-light);
            background: var(--card-hover);
        }
        .card .card-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .card .card-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            min-height: 32px;
        }
        .card .card-value .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            background: var(--text-muted);
        }
        .card .card-value .status-dot.connected {
            background: var(--success);
        }
        .card .card-value .status-dot.disconnected {
            background: var(--error);
        }
        .card .card-value .status-dot.injected {
            background: var(--success);
        }
        .card .card-value .status-dot.injecting {
            background: var(--warning);
        }
        .card .card-value .status-dot.unknown {
            background: var(--text-muted);
        }
        .card .card-value .status-dot.not-injected {
            background: var(--error);
        }

        .card .card-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ===== RECENT ACTIVITY ===== */
        .activity-section .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }
        .activity-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 8px 0;
            min-height: 120px;
            max-height: 280px;
            overflow-y: auto;
        }
        .activity-item {
            padding: 8px 20px;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-item .time {
            color: var(--text-muted);
            font-size: 12px;
            flex-shrink: 0;
            min-width: 52px;
        }
        .activity-item .msg {
            flex: 1;
        }
        .activity-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ===== EXECUTOR TAB ===== */
        .executor-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 480px;
        }
        .executor-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 0 12px 0;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .executor-toolbar .toolbar-btn {
            padding: 8px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .executor-toolbar .toolbar-btn:hover {
            background: var(--card-hover);
            border-color: var(--border-light);
        }
        .executor-toolbar .toolbar-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .executor-toolbar .toolbar-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .executor-toolbar .toolbar-btn.danger {
            color: var(--error);
        }
        .executor-toolbar .toolbar-btn.danger:hover {
            background: rgba(244, 67, 54, .1);
            border-color: rgba(244, 67, 54, .3);
        }
        .executor-toolbar .toolbar-btn i {
            font-size: 14px;
        }
        .executor-editor {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            min-height: 300px;
            background: #1e1e1e;
        }
        #monaco-container {
            width: 100%;
            height: 100%;
            min-height: 300px;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay .2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeInOverlay {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 700px;
            max-width: 94vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            animation: slideUp .25s ease;
        }
        @keyframes slideUp {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .modal-header .close-btn {
            font-size: 20px;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .modal-header .close-btn:hover {
            background: var(--card);
            color: var(--text);
        }
        .modal-body {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 24px;
            border-top: 1px solid var(--border);
        }
        .modal-footer .btn {
            padding: 8px 20px;
            border-radius: var(--radius);
            font-weight: 500;
            font-size: 13px;
            background: var(--card);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .modal-footer .btn:hover {
            background: var(--card-hover);
            border-color: var(--border-light);
        }
        .modal-footer .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .modal-footer .btn.primary:hover {
            background: var(--accent-hover);
        }
        .modal-footer .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ===== PROCESS TABLE ===== */
        .process-table-wrap {
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .process-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .process-table th {
            background: var(--card);
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .3px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .process-table td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .process-table tr:hover td {
            background: rgba(255, 255, 255, .02);
        }
        .process-table .status-badge {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(76, 175, 80, .15);
            color: var(--success);
            display: inline-block;
        }
        .process-table .status-badge.not-running {
            background: rgba(244, 67, 54, .12);
            color: var(--error);
        }
        .process-table input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .table-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ===== AUTO EXECUTE ===== */
        .autoexec-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .autoexec-header .left {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .autoexec-header .left strong {
            color: var(--text);
        }
        .autoexec-header .actions {
            display: flex;
            gap: 8px;
        }
        .autoexec-header .actions .btn {
            padding: 7px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .autoexec-header .actions .btn:hover {
            background: var(--card-hover);
            border-color: var(--border-light);
        }
        .autoexec-header .actions .btn i {
            font-size: 13px;
        }
        .autoexec-files {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 8px 0;
            min-height: 120px;
            max-height: 400px;
            overflow-y: auto;
        }
        .autoexec-file {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
        }
        .autoexec-file:last-child {
            border-bottom: none;
        }
        .autoexec-file .name {
            color: var(--text);
            font-weight: 500;
        }
        .autoexec-file .file-actions {
            display: flex;
            gap: 8px;
        }
        .autoexec-file .file-actions button {
            color: var(--text-muted);
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .autoexec-file .file-actions button:hover {
            color: var(--error);
            background: rgba(244, 67, 54, .1);
        }
        .autoexec-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ===== SETTINGS ===== */
        .settings-group {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 8px 0;
            margin-bottom: 16px;
        }
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            border-bottom: 1px solid var(--border);
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .setting-item .info .label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }
        .setting-item .info .desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .switch {
            position: relative;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        .switch .slider {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 12px;
            transition: var(--transition);
        }
        .switch .slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: var(--transition);
        }
        .switch input:checked+.slider {
            background: var(--accent);
        }
        .switch input:checked+.slider::before {
            transform: translateX(18px);
            background: #fff;
        }

        /* ===== NOTIFICATIONS ===== */
        #toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 99998;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
            animation: toastIn .3s ease;
            position: relative;
            overflow: hidden;
        }
        .toast.removing {
            animation: toastOut .3s ease forwards;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateX(40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(40px);
            }
        }
        .toast .toast-icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .toast .toast-body {
            flex: 1;
            min-width: 0;
        }
        .toast .toast-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        .toast .toast-message {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .toast .toast-close {
            color: var(--text-muted);
            font-size: 16px;
            padding: 0 2px;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .toast .toast-close:hover {
